name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # vitest 5 needs Node 22+; the runtime check below covers Node 20.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run && (cd legacy-package && npm pack --dry-run)

      - uses: actions/upload-artifact@v4
        if: matrix.node-version == 22
        with:
          name: dist
          path: dist

  runtime-node-20:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install runtime dependencies only
        run: npm ci --omit=dev
      - name: Merge the Playwright 1.58 fixture
        run: |
          node dist/cli.js -i tests/fixtures/playwright-1.58/test-results \
            -r tests/fixtures/playwright-1.58/playwright-report.json \
            --sort report-order -o reel.mp4 -f mp4 -v
          test -s reel.mp4
