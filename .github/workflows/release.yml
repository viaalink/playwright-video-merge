name: Release & Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, build, test
        run: npm run typecheck && npm run build && npm test

      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      # Trusted publishing uses OIDC - no NPM_TOKEN needed (npm >= 11.5.1).
      # Configure at: npmjs.com → Package Settings → Trusted Publishers
      - name: Update npm for trusted publishing
        run: npm install -g npm@11

      # A version published by hand (the first release of a new package name
      # must be) is not published again; the tag still gets its GitHub release.
      - name: Publish to npm (Trusted Publishing via OIDC)
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; skipping publish" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          makeLatest: true
          allowUpdates: true
